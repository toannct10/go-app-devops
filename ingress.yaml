apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: go-app
  namespace: default
spec:
  ingressClassName: nginx
  rules:
    - host: go-web-app.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: go-app
                port:
                  number: 80
